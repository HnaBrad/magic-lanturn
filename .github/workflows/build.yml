# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"
          jar_path="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          if [ -z "$version" ] || [ -z "$jar_path" ]; then
            echo "Could not find the project version or built mod JAR."
            exit 1
          fi
          previous_tag="$(git tag --list 'build-*' --sort=-version:refname | head -n 1)"
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Changes"
            if [ -n "$previous_tag" ]; then
              git log "$previous_tag..$GITHUB_SHA" --pretty=format:'- %s'
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_SHA}"
            else
              git log "$GITHUB_SHA" -1 --pretty=format:'- %s'
              echo
              echo
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}"
            fi
          } > "$notes_file"
          gh release create "build-${GITHUB_RUN_NUMBER}" "$jar_path" \
            --target "$GITHUB_SHA" \
            --title "Magic Lanturn ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file "$notes_file"
